name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: corretto
          java-version: '27'
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-disabled: true
      - name: Install PDF validator and JPEG XL decoder
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf libjxl-dev
      - name: Build, test, and verify Maven publications
        env:
          SKALD_JXL: /usr/lib/x86_64-linux-gnu/libjxl.so
          SKALD_REQUIRE_JXL_TESTS: "1"
        run: ./gradlew clean build publishToMavenLocal
      - name: Check PDF syntax
        run: find build/use-case-pdfs -maxdepth 1 -name '*.pdf' -print0 | xargs -0 -n1 qpdf --check
      - name: Validate PDF 2.0 object model
        if: github.event_name == 'pull_request'
        run: scripts/validate-pdf2.sh build/use-case-pdfs
      - name: Upload generated PDF corpus
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: use-case-pdfs
          path: build/use-case-pdfs/
          if-no-files-found: error
          retention-days: 14
