name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - name: Build, test, and verify Maven publications
        run: ./gradlew clean build publishToMavenLocal
      - name: Check PDF syntax
        run: |
          sudo apt-get update
          sudo apt-get install --yes qpdf
          find build/use-case-pdfs -maxdepth 1 -name '*.pdf' -print0 | xargs -0 -n1 qpdf --check
      - name: Validate PDF 2.0 object model
        if: github.event_name == 'pull_request'
        run: scripts/validate-pdf2.sh build/use-case-pdfs
      - name: Upload generated PDF corpus
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: use-case-pdfs
          path: build/use-case-pdfs/
          if-no-files-found: error
          retention-days: 14
